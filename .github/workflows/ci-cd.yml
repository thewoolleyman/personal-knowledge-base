name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =============================================================================
  # Stage 1: Lint - Static analysis and code quality
  # =============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Run actionlint
        run: mise x -- actionlint

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Run gitleaks
        run: mise x -- gitleaks detect --source . --no-banner -c .gitleaks.toml

  # =============================================================================
  # Stage 2: Test - Unit and acceptance tests run in parallel
  # =============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, secrets-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests with race detection and coverage
        run: |
          set -o pipefail
          go test -race -cover -coverprofile=coverage.out ./... 2>&1 | tee test-output.txt

      - name: Enforce 100% function coverage (excluding main)
        run: |
          go tool cover -func=coverage.out > func-coverage.txt
          cat func-coverage.txt
          FAILURES=$(grep -v '^total:' func-coverage.txt | grep -v '100.0%' | grep -v '/main.go:.*[[:space:]]main[[:space:]]' || true)
          if [ -n "$FAILURES" ]; then
            echo ""
            echo "FAIL: The following functions do not have 100% line coverage:"
            echo "$FAILURES"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [lint, secrets-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run acceptance tests
        run: make test-accept

  live-tests:
    name: Live API Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, acceptance-tests]
    # Requires secrets: PKB_TOKEN_JSON, PKB_GOOGLE_CLIENT_ID, PKB_GOOGLE_CLIENT_SECRET, PKB_OBSIDIAN_FOLDER_ID, PKB_NOTION_TOKEN
    # Tests MUST NEVER be skipped — missing secrets is a hard failure.
    steps:
      - name: Verify required secrets
        env:
          PKB_GOOGLE_CLIENT_ID: ${{ secrets.PKB_GOOGLE_CLIENT_ID }}
          PKB_GOOGLE_CLIENT_SECRET: ${{ secrets.PKB_GOOGLE_CLIENT_SECRET }}
          PKB_TOKEN_JSON: ${{ secrets.PKB_TOKEN_JSON }}
          PKB_OBSIDIAN_FOLDER_ID: ${{ secrets.PKB_OBSIDIAN_FOLDER_ID }}
          PKB_NOTION_TOKEN: ${{ secrets.PKB_NOTION_TOKEN }}
        run: |
          missing=""
          [ -z "$PKB_GOOGLE_CLIENT_ID" ] && missing="$missing PKB_GOOGLE_CLIENT_ID"
          [ -z "$PKB_GOOGLE_CLIENT_SECRET" ] && missing="$missing PKB_GOOGLE_CLIENT_SECRET"
          [ -z "$PKB_TOKEN_JSON" ] && missing="$missing PKB_TOKEN_JSON"
          [ -z "$PKB_OBSIDIAN_FOLDER_ID" ] && missing="$missing PKB_OBSIDIAN_FOLDER_ID"
          [ -z "$PKB_NOTION_TOKEN" ] && missing="$missing PKB_NOTION_TOKEN"
          if [ -n "$missing" ]; then
            echo "FAIL: Missing required secrets:$missing" >&2
            echo "Add these secrets to the repository settings." >&2
            exit 1
          fi
          echo "All required secrets are configured."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Write OAuth token file
        env:
          PKB_TOKEN_JSON: ${{ secrets.PKB_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/pkb
          echo "$PKB_TOKEN_JSON" > ~/.config/pkb/token.json

      - name: Run live API tests
        env:
          PKB_GOOGLE_CLIENT_ID: ${{ secrets.PKB_GOOGLE_CLIENT_ID }}
          PKB_GOOGLE_CLIENT_SECRET: ${{ secrets.PKB_GOOGLE_CLIENT_SECRET }}
          PKB_OBSIDIAN_FOLDER_ID: ${{ secrets.PKB_OBSIDIAN_FOLDER_ID }}
          PKB_NOTION_TOKEN: ${{ secrets.PKB_NOTION_TOKEN }}
        run: make test-live

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, acceptance-tests]
    # Requires secrets: PKB_TOKEN_JSON, PKB_GOOGLE_CLIENT_ID, PKB_GOOGLE_CLIENT_SECRET
    # Skips gracefully when secrets are not configured (step-level check)
    steps:
      - name: Check for required secrets
        id: secrets_check
        env:
          PKB_GOOGLE_CLIENT_ID: ${{ secrets.PKB_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$PKB_GOOGLE_CLIENT_ID" ]; then
            echo "Secrets not configured, skipping E2E tests"
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.secrets_check.outputs.has_secrets == 'true'
        uses: actions/checkout@v4

      - name: Setup Go
        if: steps.secrets_check.outputs.has_secrets == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build pkb binary
        if: steps.secrets_check.outputs.has_secrets == 'true'
        run: make build

      - name: Setup Node.js
        if: steps.secrets_check.outputs.has_secrets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright dependencies
        if: steps.secrets_check.outputs.has_secrets == 'true'
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Write OAuth token file
        if: steps.secrets_check.outputs.has_secrets == 'true'
        env:
          PKB_TOKEN_JSON: ${{ secrets.PKB_TOKEN_JSON }}
        run: |
          if [ -z "$PKB_TOKEN_JSON" ]; then
            echo "FAIL: PKB_TOKEN_JSON secret is not set" >&2
            exit 1
          fi
          mkdir -p ~/.config/pkb
          echo "$PKB_TOKEN_JSON" > ~/.config/pkb/token.json

      - name: Run Playwright E2E tests
        if: steps.secrets_check.outputs.has_secrets == 'true'
        working-directory: tests/e2e
        env:
          PKB_GOOGLE_CLIENT_ID: ${{ secrets.PKB_GOOGLE_CLIENT_ID }}
          PKB_GOOGLE_CLIENT_SECRET: ${{ secrets.PKB_GOOGLE_CLIENT_SECRET }}
          PKB_BINARY: ../../pkb
          PKB_PORT: "8090"
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  # =============================================================================
  # Stage 3a: Check if release needed
  # =============================================================================
  check-release:
    name: Check Release Needed
    runs-on: ubuntu-latest
    needs: [unit-tests, acceptance-tests, live-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      release_created: ${{ steps.check_release.outputs.release_created }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping"
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$VERSION does not exist, will create"
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          fi

  # =============================================================================
  # Stage 3b: Build Linux/Windows artifacts on Ubuntu
  # =============================================================================
  build-linux-windows:
    name: Build Linux/Windows
    runs-on: ubuntu-latest
    needs: [check-release]
    if: needs.check-release.outputs.release_created == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Linux and Windows artifacts
        run: TARGETS="linux/amd64 linux/arm64 windows/amd64" scripts/build-release.sh "${{ needs.check-release.outputs.version }}"

      - name: Validate release artifacts
        run: scripts/validate-release.sh "${{ needs.check-release.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-linux-windows
          path: dist/*.zip
          retention-days: 1

  # =============================================================================
  # Stage 3c: Build macOS artifacts on macOS runner (with ad-hoc codesign)
  # =============================================================================
  build-macos:
    name: Build macOS (signed)
    runs-on: macos-latest
    needs: [check-release]
    if: needs.check-release.outputs.release_created == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and sign macOS artifacts
        run: TARGETS="darwin/amd64 darwin/arm64" scripts/build-release.sh "${{ needs.check-release.outputs.version }}"

      - name: Verify code signatures
        run: |
          for zip in dist/pkb-darwin-*.zip; do
            TMPDIR=$(mktemp -d)
            unzip -o "$zip" -d "$TMPDIR"
            # Find pkb binary inside the versioned subdirectory
            BINARY=$(find "$TMPDIR" -name pkb -type f | head -1)
            codesign --verify --verbose "$BINARY"
            echo "OK: $(basename "$zip") signature verified"
            rm -rf "$TMPDIR"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-macos
          path: dist/*.zip
          retention-days: 1

  # =============================================================================
  # Stage 3b: Release - Publish validated artifacts to GitHub
  # =============================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-release, build-linux-windows, build-macos]
    if: needs.check-release.outputs.release_created == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Linux/Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-linux-windows
          path: dist

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-macos
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="thewoolleyman/personal-knowledge-base"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          ## Install

          ### macOS (Apple Silicon)
          \`\`\`bash
          curl -L -O https://github.com/${REPO}/releases/download/v${VERSION}/pkb-darwin-arm64-v${VERSION}.zip
          unzip pkb-darwin-arm64-v${VERSION}.zip
          cd pkb-darwin-arm64-v${VERSION}
          xattr -d com.apple.quarantine pkb 2>/dev/null; chmod +x pkb
          sudo mv pkb /usr/local/bin/
          \`\`\`

          ### macOS (Intel)
          \`\`\`bash
          curl -L -O https://github.com/${REPO}/releases/download/v${VERSION}/pkb-darwin-amd64-v${VERSION}.zip
          unzip pkb-darwin-amd64-v${VERSION}.zip
          cd pkb-darwin-amd64-v${VERSION}
          xattr -d com.apple.quarantine pkb 2>/dev/null; chmod +x pkb
          sudo mv pkb /usr/local/bin/
          \`\`\`

          ### Linux (amd64)
          \`\`\`bash
          curl -L -O https://github.com/${REPO}/releases/download/v${VERSION}/pkb-linux-amd64-v${VERSION}.zip
          unzip pkb-linux-amd64-v${VERSION}.zip
          cd pkb-linux-amd64-v${VERSION}
          chmod +x pkb
          sudo mv pkb /usr/local/bin/
          \`\`\`

          > **macOS users:** The \`xattr\` step removes the quarantine flag that macOS adds to browser downloads. It is harmless if you downloaded via \`curl\` (which does not set quarantine).
          EOF
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file "$NOTES_FILE" \
            dist/*.zip
          rm -f "$NOTES_FILE"

      - name: Bump version for next release
        run: |
          CURRENT="${{ steps.version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH"

          echo "Bumping version: $CURRENT -> $NEXT_VERSION"
          echo "$NEXT_VERSION" > VERSION

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to $NEXT_VERSION [skip ci]"
          git pull --rebase origin main
          git push origin main

  # =============================================================================
  # Stage 4: Deploy to production server via Tailscale SSH
  # =============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [release]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.release.result == 'success'
    steps:
      - name: Verify deploy secrets
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          missing=""
          [ -z "$TS_OAUTH_CLIENT_ID" ] && missing="$missing TS_OAUTH_CLIENT_ID"
          [ -z "$TS_OAUTH_SECRET" ] && missing="$missing TS_OAUTH_SECRET"
          [ -z "$DEPLOY_TARGET" ] && missing="$missing DEPLOY_TARGET"
          if [ -n "$missing" ]; then
            echo "FAIL: Missing deploy secrets:$missing" >&2
            echo "Deploy is optional — skipping." >&2
            echo "deploy_skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy_skip=false" >> "$GITHUB_OUTPUT"
        id: check_deploy

      - name: Setup Tailscale
        if: steps.check_deploy.outputs.deploy_skip != 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via Tailscale SSH
        if: steps.check_deploy.outputs.deploy_skip != 'true'
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          ssh -o StrictHostKeyChecking=no "$DEPLOY_TARGET" bash -lc '
            set -e
            cd /data/projects/personal-knowledge-base
            git pull --ff-only origin main
            make deploy-local
          '

      - name: Verify deployment health
        if: steps.check_deploy.outputs.deploy_skip != 'true'
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          sleep 3
          ssh -o StrictHostKeyChecking=no "$DEPLOY_TARGET" "curl -sf http://localhost:9000/health || exit 1"
          echo "Deployment health check passed"

  # =============================================================================
  # Failure safety net: Auto-create P0 bug bead on unexpected CI failure
  # =============================================================================
  notify-failure:
    name: Auto-file CI failure bead
    runs-on: ubuntu-latest
    needs: [lint, secrets-scan, unit-tests, acceptance-tests, live-tests, e2e-tests, check-release, build-linux-windows, build-macos, release, deploy]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.lint.result == 'failure' ||
       needs.secrets-scan.result == 'failure' ||
       needs.unit-tests.result == 'failure' ||
       needs.acceptance-tests.result == 'failure' ||
       needs.live-tests.result == 'failure' ||
       needs.e2e-tests.result == 'failure' ||
       needs.build-linux-windows.result == 'failure' ||
       needs.build-macos.result == 'failure' ||
       needs.release.result == 'failure' ||
       needs.deploy.result == 'failure')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create P0 bug bead for CI failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect which jobs failed
          FAILED_JOBS=""
          if [ "${{ needs.lint.result }}" = "failure" ]; then FAILED_JOBS="${FAILED_JOBS}lint, "; fi
          if [ "${{ needs.secrets-scan.result }}" = "failure" ]; then FAILED_JOBS="${FAILED_JOBS}secrets-scan, "; fi
          if [ "${{ needs.unit-tests.result }}" = "failure" ]; then FAILED_JOBS="${FAILED_JOBS}unit-tests, "; fi
          if [ "${{ needs.acceptance-tests.result }}" = "failure" ]; then FAILED_JOBS="${FAILED_JOBS}acceptance-tests, "; fi
          if [ "${{ needs.live-tests.result }}" = "failure" ]; then FAILED_JOBS="${FAILED_JOBS}live-tests, "; fi
          if [ "${{ needs.e2e-tests.result }}" = "failure" ]; then FAILED_JOBS="${FAILED_JOBS}e2e-tests, "; fi
          if [ "${{ needs.build-linux-windows.result }}" = "failure" ]; then FAILED_JOBS="${FAILED_JOBS}build-linux-windows, "; fi
          if [ "${{ needs.build-macos.result }}" = "failure" ]; then FAILED_JOBS="${FAILED_JOBS}build-macos, "; fi
          if [ "${{ needs.release.result }}" = "failure" ]; then FAILED_JOBS="${FAILED_JOBS}release, "; fi
          if [ "${{ needs.deploy.result }}" = "failure" ]; then FAILED_JOBS="${FAILED_JOBS}deploy, "; fi
          FAILED_JOBS="${FAILED_JOBS%, }"

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%S.000000+00:00")"
          # Generate a short random ID with pkb- prefix matching beads convention
          ISSUE_ID="pkb-$(head -c 6 /dev/urandom | base64 | tr -dc 'a-z0-9' | head -c 3)"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # Append a P0 bug bead to issues.jsonl (same format as bd create)
          jq -nc \
            --arg id "$ISSUE_ID" \
            --arg title "CI FAILURE: $FAILED_JOBS failed on main ($SHORT_SHA)" \
            --arg desc "Automated P0 bug — CI pipeline failed on main branch.\n\nFailed jobs: $FAILED_JOBS\nCommit: $GITHUB_SHA\nRun: $RUN_URL\n\nThis bead was auto-created by the CI failure safety net. Fix immediately before starting new work." \
            --arg now "$NOW" \
            '{id:$id,title:$title,description:$desc,status:"open",priority:0,issue_type:"bug",created_at:$now,created_by:"ci-pipeline",updated_at:$now}' \
            >> .beads/issues.jsonl

          echo "Created P0 bead: $ISSUE_ID"
          echo "  Title: CI FAILURE: $FAILED_JOBS failed on main ($SHORT_SHA)"
          echo "  Run: $RUN_URL"

      - name: Commit and push bead
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .beads/issues.jsonl
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: auto-create P0 bug bead for pipeline failure [skip ci]"
          git pull --rebase origin main
          git push origin main
