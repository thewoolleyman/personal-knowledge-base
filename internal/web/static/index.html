<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PKB - Personal Knowledge Base</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: #f0f0f0; }
    .search-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .search-form input[type="text"] {
      flex: 1;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      border: 1px solid #3a3a5c;
      border-radius: 4px;
      background: #16213e;
      color: #e0e0e0;
    }
    .search-form input[type="text"]::placeholder { color: #888; }
    .search-form button {
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .search-form button:hover { background: #2563eb; }
    .sources {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
    }
    .sources label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.9rem;
      color: #aaa;
    }
    #results { list-style: none; }
    #results li {
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    #results li .title {
      font-weight: 600;
      color: #f0f0f0;
      margin-bottom: 0.25rem;
    }
    #results li .snippet {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 0.25rem;
    }
    #results li .url a {
      font-size: 0.85rem;
      color: #60a5fa;
      text-decoration: none;
    }
    #results li .url a:hover { text-decoration: underline; }
    #results li .source {
      font-size: 0.8rem;
      color: #777;
      margin-top: 0.25rem;
    }
    #status {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    #error {
      color: #f87171;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <h1>Search Your Knowledge Base <a href="https://github.com/thewoolleyman/personal-knowledge-base" style="font-size:0.6em;font-weight:normal;margin-left:0.5em;color:#60a5fa;text-decoration:none">GitHub</a></h1>

  <form class="search-form" id="searchForm">
    <input type="text" id="query" placeholder="Search..." autofocus>
    <button type="submit">Search</button>
  </form>

  <div class="sources">
    <label><input type="checkbox" name="source" value="google-drive" checked> Google Drive</label>
    <label><input type="checkbox" name="source" value="gmail"> Gmail</label>
    <label><input type="checkbox" name="source" value="obsidian" checked> Obsidian</label>
    <label><input type="checkbox" name="source" value="notion"> Notion</label>
    <label><input type="checkbox" name="source" value="claude"> Claude</label>
  </div>

  <details style="margin-bottom:1.5rem;font-size:0.9rem;color:#aaa">
    <summary style="cursor:pointer">Import Claude conversations</summary>
    <div style="margin-top:0.5rem;display:flex;gap:0.5rem;align-items:center">
      <input type="file" id="claudeFile" accept=".json,.zip">
      <button type="button" id="uploadBtn" style="padding:0.4rem 1rem;font-size:0.85rem;background:#3b82f6;color:white;border:none;border-radius:4px;cursor:pointer">Upload</button>
      <span id="uploadStatus" style="font-size:0.85rem"></span>
    </div>
  </details>

  <div id="status"></div>
  <div id="error"></div>
  <ul id="results"></ul>

  <script>
    const form = document.getElementById('searchForm');
    const queryInput = document.getElementById('query');
    const resultsList = document.getElementById('results');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = queryInput.value.trim();
      if (!q) return;

      const checked = document.querySelectorAll('input[name="source"]:checked');
      const sources = Array.from(checked).map(cb => cb.value).join(',');

      statusEl.textContent = 'Searching...';
      errorEl.textContent = '';
      resultsList.innerHTML = '';

      try {
        let url = '/search?q=' + encodeURIComponent(q);
        if (sources) url += '&sources=' + encodeURIComponent(sources);

        const resp = await fetch(url);
        const data = await resp.json();

        if (!resp.ok) {
          errorEl.textContent = data.error || 'Search failed';
          statusEl.textContent = '';
          return;
        }

        statusEl.textContent = data.length === 0
          ? 'No results found.'
          : data.length + ' result' + (data.length === 1 ? '' : 's');

        data.forEach(r => {
          const li = document.createElement('li');
          li.innerHTML =
            '<div class="title">' + escapeHtml(r.Title) + '</div>' +
            (r.Snippet ? '<div class="snippet">' + escapeHtml(r.Snippet) + '</div>' : '') +
            (r.URL ? '<div class="url"><a href="' + escapeHtml(r.URL) + '" target="_blank">' + escapeHtml(r.URL) + '</a></div>' : '') +
            '<div class="source">' + escapeHtml(r.Source) + '</div>';
          resultsList.appendChild(li);
        });
      } catch (err) {
        errorEl.textContent = 'Network error: ' + err.message;
        statusEl.textContent = '';
      }
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('uploadBtn').addEventListener('click', async () => {
      const fileInput = document.getElementById('claudeFile');
      const uploadStatus = document.getElementById('uploadStatus');
      if (!fileInput.files.length) {
        uploadStatus.textContent = 'Please select a file.';
        uploadStatus.style.color = '#f87171';
        return;
      }
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      uploadStatus.textContent = 'Uploading...';
      uploadStatus.style.color = '#aaa';
      try {
        const resp = await fetch('/import-claude', { method: 'POST', body: formData });
        const data = await resp.json();
        if (resp.ok) {
          uploadStatus.textContent = 'Imported successfully.';
          uploadStatus.style.color = '#4ade80';
        } else {
          uploadStatus.textContent = data.error || 'Upload failed.';
          uploadStatus.style.color = '#f87171';
        }
      } catch (err) {
        uploadStatus.textContent = 'Network error: ' + err.message;
        uploadStatus.style.color = '#f87171';
      }
    });
  </script>
</body>
</html>
